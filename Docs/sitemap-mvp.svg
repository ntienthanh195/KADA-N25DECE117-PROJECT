<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1280" viewBox="0 0 2048 1280">
  <defs>
    <style>
      .title { font: 700 50px Arial, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 25px Arial, "Segoe UI", sans-serif; fill: #536078; }
      .section { font: 700 28px Arial, "Segoe UI", sans-serif; fill: #26334c; }
      .node-title { font: 700 23px Arial, "Segoe UI", sans-serif; fill: #172033; }
      .node-sub { font: 400 19px Arial, "Segoe UI", sans-serif; fill: #536078; }
      .legend { font: 600 20px Arial, "Segoe UI", sans-serif; fill: #344158; }
      .box { stroke-width: 2.5; rx: 18; }
      .public { fill: #eef4ff; stroke: #7093d4; }
      .user { fill: #edfbf4; stroke: #53a878; }
      .admin { fill: #fff4e8; stroke: #d58a3a; }
      .result { fill: #f4efff; stroke: #8b6dc7; }
      .line { fill: none; stroke: #738096; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #d6dce7; stroke-width: 2; stroke-dasharray: 10 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#738096"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18243a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="2048" height="1280" fill="#ffffff"/>
  <text x="1024" y="75" text-anchor="middle" class="title">SITEMAP MVP — WEBSITE HỖ TRỢ SỬA ĐỒ GIA DỤNG BẰNG AI</text>
  <text x="1024" y="116" text-anchor="middle" class="subtitle">Bản đồ các trang và đường điều hướng trong phiên bản hoàn thành trong 5 tuần</text>

  <g transform="translate(1210,142)">
    <rect x="0" y="0" width="24" height="24" rx="6" class="public"/>
    <text x="36" y="20" class="legend">Trang công khai</text>
    <rect x="235" y="0" width="24" height="24" rx="6" class="user"/>
    <text x="271" y="20" class="legend">Người dùng</text>
    <rect x="430" y="0" width="24" height="24" rx="6" class="admin"/>
    <text x="466" y="20" class="legend">Quản trị viên</text>
  </g>

  <!-- Public pages -->
  <rect x="844" y="180" width="360" height="84" class="box public" filter="url(#shadow)"/>
  <text x="1024" y="216" text-anchor="middle" class="node-title">TRANG CHỦ</text>
  <text x="1024" y="246" text-anchor="middle" class="node-sub">Giới thiệu và bắt đầu sử dụng</text>

  <rect x="320" y="320" width="290" height="84" class="box public"/>
  <text x="465" y="356" text-anchor="middle" class="node-title">ĐĂNG KÝ</text>
  <text x="465" y="386" text-anchor="middle" class="node-sub">Tạo tài khoản mới</text>

  <rect x="879" y="320" width="290" height="84" class="box public"/>
