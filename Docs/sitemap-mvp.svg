  <path d="M 1450 610 C 1370 640, 1280 650, 1225 685" class="line"/>
  <path d="M 1515 610 L 1530 685" class="line"/>
  <path d="M 1580 610 C 1660 638, 1770 650, 1837 685" class="line"/>

  <rect x="1120" y="860" width="750" height="185" rx="22" fill="#fffaf3" stroke="#edc38e" stroke-width="2"/>
  <text x="1495" y="907" text-anchor="middle" class="node-title">GHI CHÚ PHẠM VI MVP</text>
  <text x="1160" y="950" class="node-sub">• Chỉ hỗ trợ 2–3 loại thiết bị trong phiên bản đầu.</text>
  <text x="1160" y="987" class="node-sub">• Chưa phân tích video hoặc âm thanh.</text>
  <text x="1160" y="1024" class="node-sub">• Admin sửa kho hướng dẫn, không sửa trực tiếp câu trả lời của AI.</text>
